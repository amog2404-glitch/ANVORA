<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANVORA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./sidepanel.css">
</head>
<body>
  <!-- ANVORA Primary React Liquid Glass Interface -->
  <div id="anvora-react-root"></div>

  <!-- Legacy Assistant Engine DOM: Preserved invisibly for sidepanel.ts engine hooks -->
  <div id="legacy-engine-dom" style="display: none !important;" aria-hidden="true">
    <main>
      <header>
        <div class="brand-container">
          <h1>ANVORA</h1>
          <span class="brand-tag">AUTONOMOUS INTELLIGENCE</span>
        </div>
        <div class="header-pills">
          <div class="header-actions">
            <button id="reset-btn" aria-label="Reset Session" title="Reset Session"></button>
            <button id="settings-btn" aria-label="Settings" title="Settings"></button>
            <button id="debug-btn" aria-label="Toggle Debug Telemetry" title="Toggle Debug Telemetry"></button>
          </div>
        </div>
      </header>

      <section id="chat-log" aria-live="polite">
        <div id="welcome-card" class="message agent">
          <div class="message-header">ANVORA</div>
          <div class="message-body"></div>
        </div>
      </section>

      <section id="debug-log" aria-live="polite">
        <button class="close-overlay-btn" id="close-debug-btn" aria-label="Close Debug"></button>
      </section>

      <section id="settings-view" aria-live="polite">
        <button class="close-overlay-btn" id="close-settings-btn" aria-label="Close Settings"></button>
        <select id="agent-language"><option value="en">English</option></select>
        <select id="gemini-model"><option value="gemini-3.1-flash-lite">gemini-3.1-flash-lite</option></select>
        <input type="password" id="gemini-api-key" placeholder="AIzaSy...">
        <input type="password" id="groq-api-key" placeholder="gsk_...">
        <input type="range" id="speech-rate" min="0.8" max="1.4" step="0.1" value="1.0">
        <span id="speech-rate-val">1.0x</span>
        <select id="text-size-select"><option value="normal">Normal</option></select>
        <input type="checkbox" id="high-contrast-toggle">
        <input type="checkbox" id="vision-toggle">
        <input type="checkbox" id="rate-limit-toggle">
        <input type="number" id="rate-limit-duration" value="2100">
        <button id="save-settings-btn">Save Settings</button>
        <button id="export-data-btn">Export Data</button>
        <span id="save-status"></span>
      </section>

      <section id="status-panel" aria-live="polite">
        <div id="mic-indicator" class="siri-orb-wrapper" aria-label="Toggle ANVORA Microphone" data-state="idle" role="button" tabindex="0">
          <div class="orb-mesh"></div>
          <div class="siri-orb">
            <div id="siri-wave-mount"></div>
          </div>
        </div>
        <p id="agent-state" class="state-pill">ANVORA is ready (Ctrl+Space)</p>
      </section>
    </main>
  </div>

  <script type="module" src="./AnvoraMount.tsx"></script>
  <script type="module" src="./sidepanel.ts"></script>
</body>
</html>
